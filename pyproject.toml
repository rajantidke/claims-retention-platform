[project]
name = "claims-retention-platform"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "duckdb>=1.1",
    "polars>=1.9",
    "pandas>=2.2",
    "pyarrow>=17",
    "requests>=2.32",
    "tqdm>=4.66",
    "matplotlib>=3.9",
    "seaborn>=0.13",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "pre-commit>=4", "jupyterlab>=4"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.setuptools.packages.find]
include = ["ingest*", "models*", "experiments*", "tests*"]
