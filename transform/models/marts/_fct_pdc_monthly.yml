version: 2

models:
  - name: fct_pdc_monthly
    description: >
      One row per calendar month, within the analysis window. Proportion
      of Days Covered (PDC), computed from int_coverage_spells overlapped
      against each calendar month. Computed for pipeline completeness and
      portability; NOT interpretable as a real adherence signal on this
      dataset, because days supply is decoupled from actual fill timing
      (Gate 6 Test 1, docs/fidelity_audit.md) -- a high, stable average
      PDC here reflects how coverage spells get merged and summed, not
      genuine clinical adherence. max_pdc is intentionally uncapped at
      the aggregate level: if it ever exceeds 1.0, that signals a real
      bug in the overlap or spell-merge logic, since no beneficiary can
      be covered more than 100% of a month's days. Per-beneficiary-month
      pdc is uncapped too: a least(1.0, ...) cap sat here until 2026-10,
      when the int_coverage_spells tiebreak bug it was silently absorbing
      (9 beneficiary-months, found 2026-10-07) was fixed. Confirmed the
      cap had become dead code (zero raw-ratio violations post-fix) and
      removed it, replacing it with
      tests/assert_pdc_never_exceeds_one.sql, a singular test that fails
      loudly on any future violation instead of quietly capping it.
    columns:
      - name: month_start
        data_tests:
          - not_null
          - unique
      - name: max_pdc
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                max_value: 1.0
                inclusive: true
