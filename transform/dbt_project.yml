name: claims_retention
version: 1.0.0
config-version: 2
profile: claims_retention

model-paths: ["models"]
seed-paths: ["seeds"]
test-paths: ["tests"]
macro-paths: ["macros"]
target-path: "target"
clean-targets: ["target", "dbt_packages"]

vars:
  # Every analysis boundary is config, never hardcoded in a model.
  study_start:      '2008-01-01'   # earliest data present; base tables and lookback
  analysis_start:   '2008-04-01'   # first month at/above 90% of the 2009 plateau (Gate 4)
  clean_window_end: '2010-01-31'   # conservative: Gate 4 first drops below 90% in Mar 2010
  gap_days: 60                     # discontinuation gap definition
  washout_days: 180                # new-user washout

models:
  claims_retention:
    staging:
      +materialized: view
      +schema: staging
    intermediate:
      +materialized: table
      +schema: intermediate
    marts:
      +materialized: table
      +schema: marts
